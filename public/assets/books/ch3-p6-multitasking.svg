  <line x1="180" y1="70" x2="70" y2="94" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="136" y="96" width="92" height="34" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
