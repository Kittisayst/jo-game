<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 156" width="360" height="156">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e"/>
    </marker>
  </defs>
  <rect width="360" height="156" rx="10" fill="#0f172a"/>
  <rect width="360" height="156" rx="10" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="357" height="153" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Input Devices -->
  <g font-family="Noto Sans Lao, sans-serif">
    <rect x="18" y="16" width="126" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="26" y="23" width="22" height="14" rx="2" fill="#0284c7"/>
    <text x="56" y="34" fill="#f8fafc" font-size="11" font-weight="bold">Keyboard ຄີບອດ</text>

    <rect x="18" y="50" width="126" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="31" y="55" width="12" height="18" rx="6" fill="#0284c7"/>
    <text x="56" y="68" fill="#f8fafc" font-size="11" font-weight="bold">Mouse ເມົາສ໌</text>

    <rect x="18" y="84" width="126" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="37" cy="95" r="5" fill="#0284c7"/>
    <line x1="37" y1="100" x2="37" y2="106" stroke="#38bdf8" stroke-width="2"/>
    <text x="56" y="102" fill="#f8fafc" font-size="11" font-weight="bold">Mic ໄມໂຄຣໂຟນ</text>

    <rect x="18" y="118" width="126" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="37" cy="130" r="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="56" y="134" fill="#f8fafc" font-size="11" font-weight="bold">Webcam / Scanner</text>
  </g>

  <!-- Data Flow Arrows -->
  <path d="M148 30 L216 68" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M148 64 L216 75" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M148 98 L216 83" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M148 130 L216 90" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="182" y="50" text-anchor="middle" fill="#38bdf8" font-family="Noto Sans Lao, sans-serif" font-size="10" font-weight="bold">INPUT ▶</text>

  <!-- Computer Target -->
  <rect x="222" y="38" width="120" height="82" rx="10" fill="#083344" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="256" y="50" width="52" height="32" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="282" y="70" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">01101</text>
  <text x="282" y="100" text-anchor="middle" fill="#f8fafc" font-family="Noto Sans Lao, sans-serif" font-size="12" font-weight="bold">ຄອມພິວເຕີ</text>
  <text x="282" y="114" text-anchor="middle" fill="#7dd3fc" font-family="Noto Sans Lao, sans-serif" font-size="9.5">ຮັບຂໍ້ມູນເຂົ້າປະມວນຜົນ</text>
</svg>
