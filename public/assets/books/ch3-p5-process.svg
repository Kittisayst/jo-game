<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 156" width="360" height="156">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="360" height="156" rx="10" fill="#0f172a"/>
  <rect width="360" height="156" rx="10" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="357" height="153" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="180" y="20" text-anchor="middle" fill="#e2e8f0" font-family="Noto Sans Lao, sans-serif" font-size="12" font-weight="bold">Process ແລະ Thread</text>
  <rect x="14" y="40" width="150" height="76" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="89" y="78" text-anchor="middle" fill="#38bdf8" font-family="Noto Sans Lao, sans-serif" font-size="11" font-weight="bold">Process</text>
  <text x="89" y="92" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans Lao, sans-serif" font-size="8.5">ໂປຣແກຣມທີ່ກຳລັງແລ່ນ</text>
  <rect x="36" y="86" width="30" height="20" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="76" y="86" width="30" height="20" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="116" y="86" width="30" height="20" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="90" y="100" text-anchor="middle" fill="#22c55e" font-family="Noto Sans Lao, sans-serif" font-size="8">Thread</text>
  <rect x="196" y="40" width="150" height="76" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="271" y="78" text-anchor="middle" fill="#f59e0b" font-family="Noto Sans Lao, sans-serif" font-size="11" font-weight="bold">Task Manager</text>
  <text x="271" y="92" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans Lao, sans-serif" font-size="8.5">ເບິ່ງ Process ທັງໝົດ</text>
  <rect x="222" y="86" width="98" height="20" rx="4" fill="#7f1d1d" stroke="#f87171" stroke-width="1.5"/>
  <text x="271" y="100" text-anchor="middle" fill="#fecaca" font-family="Noto Sans Lao, sans-serif" font-size="9">End Task</text>
  <text x="180" y="138" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans Lao, sans-serif" font-size="9">ປິດໂປຣແກຣມທີ່ຄ້າງດ້ວຍ End Task</text>
</svg>
