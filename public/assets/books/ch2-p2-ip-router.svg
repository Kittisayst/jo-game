<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 156" width="360" height="156">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e"/>
    </marker>
  </defs>
  <rect width="360" height="156" rx="10" fill="#0f172a"/>
  <rect width="360" height="156" rx="10" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="357" height="153" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Devices with IP -->
  <rect x="14" y="24" width="106" height="44" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="67" y="42" text-anchor="middle" fill="#f8fafc" font-family="Noto Sans Lao, sans-serif" font-size="11" font-weight="bold">💻 ຄອມພິວເຕີ</text>
  <text x="67" y="58" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">IP: 192.168.1.10</text>

  <rect x="14" y="88" width="106" height="44" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.8"/>
  <text x="67" y="106" text-anchor="middle" fill="#f8fafc" font-family="Noto Sans Lao, sans-serif" font-size="11" font-weight="bold">📱 ມືຖື (Wi-Fi)</text>
  <text x="67" y="122" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="10">IP: 192.168.1.11</text>

  <!-- Links to Router -->
  <line x1="122" y1="46" x2="152" y2="68" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <line x1="122" y1="110" x2="152" y2="88" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Central Router -->
  <rect x="154" y="46" width="84" height="64" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="2.2"/>
  <line x1="178" y1="46" x2="174" y2="30" stroke="#fbbf24" stroke-width="2.5"/>
  <line x1="214" y1="46" x2="218" y2="30" stroke="#fbbf24" stroke-width="2.5"/>
  <circle cx="174" cy="28" r="2.5" fill="#38bdf8"/>
  <circle cx="218" cy="28" r="2.5" fill="#38bdf8"/>
  <text x="196" y="75" text-anchor="middle" fill="#fde047" font-family="Noto Sans Lao, sans-serif" font-size="12" font-weight="bold">Router</text>
  <text x="196" y="92" text-anchor="middle" fill="#fed7aa" font-family="Noto Sans Lao, sans-serif" font-size="9.5">ກຳນົດເສັ້ນທາງ</text>
  <text x="196" y="104" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="8.5">192.168.1.1</text>

  <!-- Out to Internet -->
  <line x1="240" y1="78" x2="266" y2="78" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <rect x="268" y="48" width="78" height="60" rx="8" fill="#083344" stroke="#22c55e" stroke-width="2"/>
  <text x="307" y="75" text-anchor="middle" fill="#4ade80" font-family="Noto Sans Lao, sans-serif" font-size="11.5" font-weight="bold">Internet</text>
  <text x="307" y="92" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="9">203.0.113.5</text>
</svg>
