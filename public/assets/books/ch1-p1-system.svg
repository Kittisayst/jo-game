<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 156" width="360" height="156">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e"/>
    </marker>
  </defs>
  <rect width="360" height="156" rx="10" fill="#0f172a"/>
  <rect width="360" height="156" rx="10" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="357" height="153" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Hardware Card -->
  <rect x="16" y="30" width="96" height="96" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="40" y="44" width="48" height="32" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <rect x="45" y="49" width="38" height="22" fill="#0284c7"/>
  <rect x="58" y="76" width="12" height="6" fill="#94a3b8"/>
  <rect x="48" y="82" width="32" height="3" rx="1.5" fill="#cbd5e1"/>
  <text x="64" y="103" text-anchor="middle" fill="#38bdf8" font-family="Noto Sans Lao, sans-serif" font-size="12" font-weight="bold">Hardware</text>
  <text x="64" y="118" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans Lao, sans-serif" font-size="10">ຈັບຕ້ອງໄດ້</text>

  <!-- Software Card -->
  <rect x="132" y="30" width="96" height="96" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <rect x="154" y="44" width="52" height="38" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
  <circle cx="161" cy="50" r="2" fill="#ef4444"/>
  <circle cx="167" cy="50" r="2" fill="#f59e0b"/>
  <circle cx="173" cy="50" r="2" fill="#22c55e"/>
  <path d="M166 61 L160 66 L166 71 M182 61 L188 66 L182 71 M176 59 L172 73" stroke="#e9d5ff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="180" y="103" text-anchor="middle" fill="#c084fc" font-family="Noto Sans Lao, sans-serif" font-size="12" font-weight="bold">Software</text>
  <text x="180" y="118" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans Lao, sans-serif" font-size="10">ຊຸດຄຳສັ່ງ/ໂປຣແກຣມ</text>

  <!-- Peopleware Card -->
  <rect x="248" y="30" width="96" height="96" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="296" cy="54" r="11" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <path d="M276 82 C276 68, 316 68, 316 82" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="296" y="103" text-anchor="middle" fill="#fbbf24" font-family="Noto Sans Lao, sans-serif" font-size="12" font-weight="bold">Peopleware</text>
  <text x="296" y="118" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans Lao, sans-serif" font-size="10">ຜູ້ໃຊ້ / ຜູ້ພັດທະນາ</text>

  <!-- Connectors -->
  <line x1="114" y1="78" x2="130" y2="78" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" marker-start="url(#arrowCyan)"/>
  <line x1="230" y1="78" x2="246" y2="78" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowGold)" marker-start="url(#arrowGold)"/>
</svg>
