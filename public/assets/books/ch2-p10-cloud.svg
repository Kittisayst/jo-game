<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 156" width="360" height="156">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="360" height="156" rx="10" fill="#0f172a"/>
  <rect width="360" height="156" rx="10" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="357" height="153" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="180" y="20" text-anchor="middle" fill="#e2e8f0" font-family="Noto Sans Lao, sans-serif" font-size="12" font-weight="bold">Upload · Download · Cloud</text>
  <rect x="20" y="56" width="90" height="44" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="65" y="82" text-anchor="middle" fill="#38bdf8" font-family="Noto Sans Lao, sans-serif" font-size="11" font-weight="bold">ເຄື່ອງເຮົາ</text>
  <rect x="250" y="56" width="90" height="44" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="295" y="78" text-anchor="middle" fill="#22c55e" font-family="Noto Sans Lao, sans-serif" font-size="11" font-weight="bold">CLOUD</text>
  <text x="295" y="92" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans Lao, sans-serif" font-size="8.5">ເກັບໃນອິນເຕີເນັດ</text>
  <line x1="112" y1="66" x2="248" y2="66" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="180" y="60" text-anchor="middle" fill="#f59e0b" font-family="Noto Sans Lao, sans-serif" font-size="10">Upload ↑</text>
  <line x1="248" y1="90" x2="112" y2="90" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="180" y="108" text-anchor="middle" fill="#a78bfa" font-family="Noto Sans Lao, sans-serif" font-size="10">Download ↓</text>
  <text x="180" y="138" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans Lao, sans-serif" font-size="9">Backup = ສຳຮອງໄວ້ອີກບ່ອນ</text>
</svg>
