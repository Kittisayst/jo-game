<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 156" width="360" height="156">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e"/>
    </marker>
  </defs>
  <rect width="360" height="156" rx="10" fill="#0f172a"/>
  <rect width="360" height="156" rx="10" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="357" height="153" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Computer Source -->
  <rect x="18" y="38" width="118" height="82" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="52" y="50" width="50" height="30" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="77" y="69" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">CPU</text>
  <text x="77" y="99" text-anchor="middle" fill="#fbbf24" font-family="Noto Sans Lao, sans-serif" font-size="12" font-weight="bold">ປະມວນຜົນແລ້ວ</text>
  <text x="77" y="113" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans Lao, sans-serif" font-size="9.5">ສົ່ງຜົນຮັບອອກມາ</text>

  <!-- Arrows -->
  <path d="M138 68 L204 32" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M138 76 L204 66" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M138 84 L204 100" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M138 92 L204 130" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="172" y="50" text-anchor="middle" fill="#4ade80" font-family="Noto Sans Lao, sans-serif" font-size="10" font-weight="bold">OUTPUT ▶</text>

  <!-- Output Devices -->
  <g font-family="Noto Sans Lao, sans-serif">
    <rect x="210" y="16" width="132" height="28" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="218" y="22" width="20" height="14" rx="2" fill="#15803d"/>
    <text x="246" y="34" fill="#f8fafc" font-size="11" font-weight="bold">Monitor ຈໍພາບ</text>

    <rect x="210" y="50" width="132" height="28" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="219" y="58" width="18" height="12" rx="2" fill="#15803d"/>
    <rect x="222" y="54" width="12" height="5" fill="#f8fafc"/>
    <text x="246" y="68" fill="#f8fafc" font-size="11" font-weight="bold">Printer ເຄື່ອງພິມ</text>

    <rect x="210" y="84" width="132" height="28" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <polygon points="220,95 226,95 232,90 232,106 226,101 220,101" fill="#22c55e"/>
    <text x="246" y="102" fill="#f8fafc" font-size="11" font-weight="bold">Speaker ລຳໂພງ</text>

    <rect x="210" y="118" width="132" height="24" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="228" cy="130" r="6" fill="#15803d" stroke="#86efac" stroke-width="1.5"/>
    <text x="246" y="134" fill="#f8fafc" font-size="11" font-weight="bold">Projector ໂປຣເຈັກເຕີ</text>
  </g>
</svg>
