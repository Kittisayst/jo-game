<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 156" width="360" height="156">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="360" height="156" rx="10" fill="#0f172a"/>
  <rect width="360" height="156" rx="10" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="357" height="153" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="180" y="20" text-anchor="middle" fill="#e2e8f0" font-family="Noto Sans Lao, sans-serif" font-size="12" font-weight="bold">ອຸປະກອນເຄືອຂ່າຍ</text>
  <rect x="12" y="52" width="70" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="47" y="77" text-anchor="middle" fill="#f59e0b" font-family="Noto Sans Lao, sans-serif" font-size="11" font-weight="bold">ISP</text>
  <text x="47" y="91" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans Lao, sans-serif" font-size="8.5">ອິນເຕີເນັດ</text>
  <line x1="84" y1="77" x2="100" y2="77" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="102" y="52" width="70" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="137" y="77" text-anchor="middle" fill="#38bdf8" font-family="Noto Sans Lao, sans-serif" font-size="11" font-weight="bold">MODEM</text>
  <text x="137" y="91" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans Lao, sans-serif" font-size="8.5">ແປງສັນຍານ</text>
  <line x1="174" y1="77" x2="190" y2="77" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="192" y="52" width="70" height="50" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="227" y="77" text-anchor="middle" fill="#22c55e" font-family="Noto Sans Lao, sans-serif" font-size="11" font-weight="bold">ROUTER</text>
  <text x="227" y="91" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans Lao, sans-serif" font-size="8.5">ແຈກ IP</text>
  <line x1="264" y1="77" x2="280" y2="77" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="282" y="52" width="68" height="50" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="316" y="77" text-anchor="middle" fill="#a78bfa" font-family="Noto Sans Lao, sans-serif" font-size="11" font-weight="bold">SWITCH</text>
  <text x="316" y="91" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans Lao, sans-serif" font-size="8.5">ເຊື່ອມ LAN</text>
  <text x="180" y="134" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans Lao, sans-serif" font-size="9">ISP → Modem → Router → Switch → ຄອມພິວເຕີ</text>
</svg>
