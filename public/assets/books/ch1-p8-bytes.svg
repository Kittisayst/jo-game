<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 156" width="360" height="156">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="360" height="156" rx="10" fill="#0f172a"/>
  <rect width="360" height="156" rx="10" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="357" height="153" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>
  <g font-family="Noto Sans Lao, sans-serif" text-anchor="middle">
    <text x="180" y="20" fill="#e2e8f0" font-size="12" font-weight="bold">Bit ແລະ Byte</text>
    <rect x="10.0" y="44" width="77.5" height="60" rx="6" fill="#083344" stroke="#38bdf8" stroke-width="2"/>
    <text x="48.75" y="73.0" fill="#bae6fd" font-size="11" font-weight="bold">1 Bit</text>
    <text x="48.75" y="87.0" fill="#38bdf8" font-size="9">0 ຫຼື 1</text>
    <rect x="97.5" y="44" width="77.5" height="60" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="2"/>
    <text x="136.25" y="73.0" fill="#e9d5ff" font-size="11" font-weight="bold">1 Byte</text>
    <text x="136.25" y="87.0" fill="#a855f7" font-size="9">= 8 Bit</text>
    <rect x="185.0" y="44" width="77.5" height="60" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
    <text x="223.75" y="73.0" fill="#bbf7d0" font-size="11" font-weight="bold">1 KB</text>
    <text x="223.75" y="87.0" fill="#22c55e" font-size="9">= 1,024 Byte</text>
    <rect x="272.5" y="44" width="77.5" height="60" rx="6" fill="#422006" stroke="#f59e0b" stroke-width="2"/>
    <text x="311.25" y="73.0" fill="#fde68a" font-size="11" font-weight="bold">1 MB</text>
    <text x="311.25" y="87.0" fill="#f59e0b" font-size="9">= 1,024 KB</text>
    <text x="180" y="132" fill="#94a3b8" font-size="10">ນ້ອຍ ➜ ໃຫຍ່: Bit &lt; Byte &lt; KB &lt; MB &lt; GB</text>
  </g>
</svg>
