  <text x="180" y="130" text-anchor="middle" fill="#f87171" font-family="Noto Sans Lao, sans-serif" font-size="9">ບໍ່ມີ Driver ທີ່ຖືກຕ້ອງ → ໃຊ້ອຸປະກອນບໍ່ໄດ້</text>
