  <rect x="8" y="54" width="88" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="52" y="83" text-anchor="middle" fill="#f59e0b" font-family="Noto Sans Lao, sans-serif" font-size="11" font-weight="bold">OS</text>
  <line x1="98" y1="79" x2="124" y2="79" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="126" y="54" width="108" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="180" y="79" text-anchor="middle" fill="#38bdf8" font-family="Noto Sans Lao, sans-serif" font-size="11" font-weight="bold">Driver</text>
