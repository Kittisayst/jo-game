  <line x1="236" y1="79" x2="262" y2="79" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="264" y="54" width="88" height="50" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
