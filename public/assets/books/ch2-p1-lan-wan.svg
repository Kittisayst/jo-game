<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 156" width="360" height="156">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e"/>
    </marker>
  </defs>
  <rect width="360" height="156" rx="10" fill="#0f172a"/>
  <rect width="360" height="156" rx="10" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="357" height="153" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- LAN Box -->
  <rect x="16" y="22" width="144" height="112" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="88" y="40" text-anchor="middle" fill="#4ade80" font-family="Noto Sans Lao, sans-serif" font-size="12" font-weight="bold">LAN (ໄລຍະໃກ້)</text>
  <text x="88" y="54" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans Lao, sans-serif" font-size="9.5">ພາຍໃນຫ້ອງຮຽນ / ອາຄານ</text>
  <rect x="30" y="68" width="28" height="20" rx="3" fill="#0f172a" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="74" y="68" width="28" height="20" rx="3" fill="#0f172a" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="118" y="68" width="28" height="20" rx="3" fill="#0f172a" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="44" y1="88" x2="88" y2="108" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="88" y1="88" x2="88" y2="108" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="132" y1="88" x2="88" y2="108" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="64" y="106" width="48" height="16" rx="4" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
  <text x="88" y="117" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="9">SWITCH</text>

  <!-- Bridge -->
  <line x1="162" y1="78" x2="196" y2="78" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)" marker-start="url(#arrowCyan)"/>

  <!-- WAN / Internet Box -->
  <rect x="200" y="22" width="144" height="112" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="272" y="40" text-anchor="middle" fill="#38bdf8" font-family="Noto Sans Lao, sans-serif" font-size="12" font-weight="bold">WAN / Internet</text>
  <text x="272" y="54" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans Lao, sans-serif" font-size="9.5">ເຊື່ອມຕໍ່ຂ້າມເມືອງ / ທົ່ວໂລກ</text>
  <circle cx="272" cy="92" r="28" fill="#083344" stroke="#38bdf8" stroke-width="2"/>
  <ellipse cx="272" cy="92" rx="13" ry="28" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="244" y1="92" x2="300" y2="92" stroke="#38bdf8" stroke-width="1.2"/>
  <circle cx="232" cy="74" r="5" fill="#f59e0b"/>
  <circle cx="312" cy="74" r="5" fill="#f59e0b"/>
  <circle cx="312" cy="110" r="5" fill="#22c55e"/>
  <line x1="237" y1="76" x2="246" y2="82" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="307" y1="76" x2="298" y2="82" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="307" y1="108" x2="298" y2="102" stroke="#4ade80" stroke-width="1.5"/>
</svg>
