<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 156" width="360" height="156">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="360" height="156" rx="10" fill="#0f172a"/>
  <rect width="360" height="156" rx="10" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="357" height="153" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="180" y="20" text-anchor="middle" fill="#e2e8f0" font-family="Noto Sans Lao, sans-serif" font-size="12" font-weight="bold">Kernel ຢູ່ແກນກາງ</text>
  <circle cx="180" cy="86" r="62" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="180" cy="86" r="34" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="180" y="90" text-anchor="middle" fill="#f59e0b" font-family="Noto Sans Lao, sans-serif" font-size="11">Kernel</text>
  <text x="180" y="52" text-anchor="middle" fill="#38bdf8" font-family="Noto Sans Lao, sans-serif" font-size="9">User space</text>
  <text x="180" y="150" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans Lao, sans-serif" font-size="9">ໂປຣແກຣມ → System Call → Kernel → ຮາດແວ</text>
  <rect x="8" y="66" width="62" height="40" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="39" y="90" text-anchor="middle" fill="#22c55e" font-family="Noto Sans Lao, sans-serif" font-size="11" font-weight="bold">ແອັບ</text>
  <line x1="72" y1="86" x2="112" y2="86" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="290" y="66" width="62" height="40" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="321" y="90" text-anchor="middle" fill="#a78bfa" font-family="Noto Sans Lao, sans-serif" font-size="11" font-weight="bold">ຮາດແວ</text>
  <line x1="248" y1="86" x2="288" y2="86" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
