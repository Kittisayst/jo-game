<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 156" width="360" height="156">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e"/>
    </marker>
  </defs>
  <rect width="360" height="156" rx="10" fill="#0f172a"/>
  <rect width="360" height="156" rx="10" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="357" height="153" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <g font-family="Noto Sans Lao, sans-serif" text-anchor="middle">
    <!-- Layer 1 Top: User -->
    <rect x="60" y="12" width="240" height="26" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="180" y="29" fill="#fbbf24" font-size="11.5" font-weight="bold">👤 ຜູ້ໃຊ້ງານ (User / Peopleware)</text>

    <!-- Layer 2: Application Software -->
    <rect x="40" y="46" width="280" height="30" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="2"/>
    <text x="180" y="61" fill="#e9d5ff" font-size="11" font-weight="bold">Application Software (ຊອບແວປະຍຸກ)</text>
    <text x="180" y="72" fill="#c084fc" font-size="9">Word • Web Browser • Photoshop • ເກມ</text>

    <!-- Layer 3: System Software -->
    <rect x="40" y="84" width="280" height="30" rx="6" fill="#083344" stroke="#38bdf8" stroke-width="2"/>
    <text x="180" y="99" fill="#bae6fd" font-size="11" font-weight="bold">System Software (ລະບົບປະຕິບັດການ OS)</text>
    <text x="180" y="110" fill="#38bdf8" font-size="9">Windows • macOS • Linux • Android</text>

    <!-- Layer 4 Bottom: Hardware -->
    <rect x="60" y="122" width="240" height="24" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.8"/>
    <text x="180" y="138" fill="#cbd5e1" font-size="11" font-weight="bold">⚙️ Hardware (CPU • RAM • ຈໍພາບ)</text>
  </g>
</svg>
